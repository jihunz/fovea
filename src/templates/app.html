<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fovea</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='12' fill='none' stroke='%230f766e' stroke-width='3.5'/%3E%3Ccircle cx='16' cy='16' r='4.5' fill='%230f766e'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/fovea.css?v={{ config_json|length }}" />
  <script>
    window.FOVEA = {{ config_json|safe }};
    (function(){try{var t=localStorage.getItem('fovea.theme')||'system';document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
  </script>
</head>
<body>
  <div id="app" class="app"></div>
  <script type="module" src="/static/app.js"></script>
</body>
</html>
