services:
  fovea:
    build: .
    container_name: fovea
    ports:
      - "8888:8000"
    volumes:
      - .:/app                 # live code + index db (./data) + models (./model)
      - ${HOST_PATH}:/host     # your datasets root, browsable inside the app
    environment:
      - HOST_PATH=${HOST_PATH}
      - CONTAINER_MOUNT=/host
      - FOVEA_DATA_DIR=/app/data
      - FOVEA_MODEL_DIR=/app/model
    restart: unless-stopped
